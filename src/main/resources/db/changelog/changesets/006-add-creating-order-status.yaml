databaseChangeLog:
  - changeSet:
      id: 6
      author: Yury Brazgunou
      changes:
        - sql:
            sql: ALTER TABLE orders DROP CONSTRAINT check_order_status
        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT check_order_status CHECK (status IN ('CREATING', 'NEW', 'PAYMENT_WAITING', 'PAYMENT_RECEIVED', 'PROCESSING', 'DELIVERED', 'CANCELLED', 'PAYMENT_FAILED'))